<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0d0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Discipline">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Built With Discipline</title>
<style>
:root{--bg:#0d0d0f;--card:#1a1a1e;--card2:#242429;--line:#35353d;--text:#f7f7f8;--muted:#aaaab2;--yellow:#f4d600;--green:#65d678;--red:#ff6b6b}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}body{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
button,input{font:inherit}button{cursor:pointer}header{position:sticky;top:0;z-index:20;background:rgba(13,13,15,.96);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.head{max-width:620px;margin:auto;padding:16px 14px 12px}.title-row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}h1{font-size:27px;margin:0}.sub{color:var(--muted);font-size:13px;margin-top:4px}.badge{background:var(--yellow);color:#111;border-radius:999px;padding:9px 12px;font-weight:900;white-space:nowrap}
.tabs{display:flex;gap:8px;overflow-x:auto;margin-top:14px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:9px 13px;font-size:13px;font-weight:850}.tab.active{background:var(--yellow);color:#111;border-color:var(--yellow)}
main{max-width:620px;margin:auto;padding:14px}.hero,.rule,.exercise,.timer,.panel,.error{background:var(--card);border:1px solid var(--line);border-radius:16px}.hero{padding:16px;margin-bottom:10px}.hero small{color:var(--muted)}.hero h2{font-size:24px;margin:4px 0}.hero p{color:var(--muted);font-size:13px;margin:0}.progress{height:8px;background:#2b2b31;border-radius:999px;overflow:hidden;margin-top:12px}.progress>div{height:100%;background:var(--yellow);width:0}
.rule{padding:13px 14px;margin-bottom:12px;border-left:4px solid var(--yellow);font-size:14px;line-height:1.45}.exercise{display:grid;grid-template-columns:28px minmax(0,1fr) 92px;gap:10px;align-items:center;padding:12px 10px;margin-bottom:9px}.exercise.done{opacity:.6}.exercise.done .name{text-decoration:line-through}.check{width:23px;height:23px;accent-color:var(--yellow)}.name{font-weight:850;line-height:1.2}.scheme,.previous,.suggest{font-size:12px;margin-top:4px}.scheme{color:var(--muted)}.previous{color:#d5d5da}.suggest{color:var(--green);font-weight:750}.weight span{display:block;color:var(--muted);font-size:10px;margin:0 0 4px 2px}.weight input{width:100%;border:1px solid #4b4b54;background:#29292f;color:var(--text);border-radius:9px;padding:9px 7px;text-align:center}.pr{display:inline-block;background:#6c5700;color:#ffe96a;border:1px solid #8d7200;border-radius:999px;padding:2px 6px;font-size:10px;font-weight:900;margin-left:5px}
.timer{display:flex;justify-content:space-between;align-items:center;padding:14px;margin-top:13px}.timer small{color:var(--muted)}#timer{font-size:28px;font-weight:900}.timer-actions{display:flex;gap:8px}.timer button,.panel button{border:0;background:var(--yellow);color:#111;border-radius:11px;padding:10px 12px;font-weight:900}.timer .ghost,.panel .ghost{background:#2b2b31;color:var(--text)}
.panel{padding:14px;margin-top:12px}.panel h3{margin:0 0 10px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:var(--card2);border-radius:12px;padding:11px;text-align:center}.stat strong{display:block;font-size:22px}.stat span{font-size:11px;color:var(--muted)}.measure-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.measure-grid label{font-size:11px;color:var(--muted)}.measure-grid input{margin-top:4px;width:100%;border:1px solid #4b4b54;background:#29292f;color:var(--text);border-radius:9px;padding:10px}.panel-actions{display:flex;gap:8px;margin-top:10px}.history{color:var(--muted);font-size:13px;line-height:1.6}.error{padding:14px;border-color:var(--red);color:#ffd4d4}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(13,13,15,.97);border-top:1px solid var(--line);padding:11px 14px calc(11px + env(safe-area-inset-bottom))}.bottom-inner{max-width:620px;margin:auto;display:grid;grid-template-columns:1fr 1.45fr;gap:10px}.bottom button{border:0;border-radius:13px;padding:14px;font-weight:900}.secondary{background:#2b2b31;color:var(--text)}.primary{background:var(--yellow);color:#111}
@media(max-width:390px){h1{font-size:23px}.exercise{grid-template-columns:26px minmax(0,1fr) 82px}.badge{font-size:13px;padding:8px 10px}}
</style>
</head>
<body>
<header><div class="head"><div class="title-row"><div><h1>Built With Discipline</h1><div class="sub">Train hard. Track everything. Progress on purpose.</div></div><div id="streak" class="badge">0 day streak</div></div><div id="tabs" class="tabs"></div></div></header>
<main id="content"><section class="hero"><h2>Loading workout…</h2></section></main>
<div class="bottom"><div class="bottom-inner"><button class="secondary" id="clearBtn">Clear Checks</button><button class="primary" id="finishBtn">Finish & Save</button></div></div>
<script>
'use strict';
const OLD_PLAN={
Monday:{title:'Push + Core',focus:'Chest, shoulders, triceps and abs',ex:[['Chest Press Machine','3 × 8–12','strength'],['Incline Chest Press Machine','3 × 8–12','strength'],['Shoulder Press Machine','3 × 8–12','strength'],['Lateral Raise Machine','3 × 12–15','strength'],['Pec Deck Fly','3 × 10–15','strength'],['Rope Triceps Pushdown','3 × 10–15','strength'],['Cable Crunch','3 × 12–15','strength'],['Hanging Knee Raise','3 × 10–15','bodyweight']]},
Tuesday:{title:'Pull',focus:'Back, rear delts and biceps',ex:[['Lat Pulldown','3 × 8–12','strength'],['Seated Row Machine','3 × 8–12','strength'],['Single-Arm Cable Row','3 × 10 each','strength'],['Rear Delt Fly Machine','3 × 12–15','strength'],['Cable Face Pull','3 × 12–15','strength'],['Preacher Curl Machine','3 × 10–12','strength'],['Cable Hammer Curl','3 × 10–12','strength'],['Back Extension','3 × 12–15','bodyweight']]},
Wednesday:{title:'Legs + Glutes',focus:'Quads, hamstrings, glutes and calves',ex:[['Leg Press','3 × 10–12','strength'],['Smith Romanian Deadlift','3 × 8–12','strength'],['Smith Hip Thrust','3 × 8–12','strength'],['Bulgarian Split Squat','3 × 8–10 each','strength'],['Seated Leg Curl','3 × 10–12','strength'],['Leg Extension','3 × 10–12','strength'],['Hip Abductor Machine','3 × 15–20','strength'],['Calf Press on Leg Press','3 × 15–20','strength']]},
Thursday:{title:'Chest + Back + Core',focus:'Upper-body compounds and abs',ex:[['Smith Machine Bench Press','3 × 8–10','strength'],['Lat Pulldown','3 × 8–12','strength'],['Incline Chest Press','3 × 10–12','strength'],['Seated Row Machine','3 × 10–12','strength'],['Cable Fly','3 × 12–15','strength'],['Straight-Arm Pulldown','3 × 12–15','strength'],['Ab Crunch Machine','3 × 12–15','strength'],['Pallof Press','3 × 10 each','strength']]},
Friday:{title:'Shoulders + Arms',focus:'Delts, biceps, triceps and traps',ex:[['Shoulder Press Machine','3 × 8–12','strength'],['Lateral Raise Machine','3 × 12–15','strength'],['Rear Delt Fly Machine','3 × 12–15','strength'],['Cable Upright Row','3 × 10–12','strength'],['Preacher Curl Machine','3 × 10–12','strength'],['Rope Triceps Pushdown','3 × 10–12','strength'],['Cable Curl','3 × 10–12','strength'],['Overhead Rope Extension','3 × 10–12','strength']]},
Saturday:{title:'Full Body + Abs',focus:'Full body, glutes, abs and conditioning',ex:[['Leg Press','3 × 10','strength'],['Chest Press Machine','3 × 10','strength'],['Lat Pulldown','3 × 10','strength'],['Smith Hip Thrust','3 × 10–12','strength'],['Seated or Lying Hamstring Curl','3 × 10–12','strength'],['Dumbbell Lateral Raise','3 × 12–15','strength'],['Cable Glute Kickback','3 × 12 each','strength'],['Walking Lunge','3 × 10 each','bodyweight'],['Cable or Machine Biceps Curl','3 × 10–12','strength'],['Rope Triceps Pushdown','3 × 10–12','strength'],['Cable Crunch','3 × 10–15','strength'],["Captain’s Chair Knee / Leg Raise",'3 × 10–15','bodyweight'],['Reverse Crunch','3 × 12–15','bodyweight'],['Weighted Decline Crunch','3 × 10–15','strength'],['Plank','2 × 45–60 sec','bodyweight'],['Incline Treadmill','10–15 min','cardio']]},
Sunday:{title:'Recovery',focus:'Restore, walk and prepare',ex:[['Easy Walk','30 min','cardio'],['Full-Body Stretch','10 min','bodyweight'],['Meal Prep','Complete','bodyweight'],['Weekly Reflection','Complete','bodyweight']]}
};
const PLAN={"Monday": {"title": "Chest + Biceps + Abs", "focus": "Chest, biceps and abs", "ex": [["Chest Press Machine", "3 × 8–12", "strength"], ["Incline Chest Press Machine", "3 × 8–12", "strength"], ["Pec Deck Fly", "2 × 12–15", "strength"], ["Bayesian Cable Curl", "3 × 10–12 each", "strength"], ["Cable Hammer Curl", "2 × 10–15", "strength"], ["Cable Crunch", "3 × 10–15", "strength"]]}, "Tuesday": {"title": "Back + Triceps", "focus": "Lats, upper back and triceps", "ex": [["Single-Arm Lat Pulldown", "3 × 8–12 each", "strength"], ["Seated Row Machine", "3 × 8–12", "strength"], ["Rear Delt Fly Machine", "2 × 12–15", "strength"], ["Rope Triceps Pushdown", "3 × 10–15", "strength"], ["Overhead Rope Extension", "2 × 10–15", "strength"]]}, "Wednesday": {"title": "Legs + Abs", "focus": "Quads, hamstrings, glutes and calves", "ex": [["Leg Press", "3 × 8–12", "strength"], ["Smith Romanian Deadlift", "3 × 8–12", "strength"], ["Seated Leg Curl", "3 × 10–15", "strength"], ["Leg Extension", "2 × 10–15", "strength"], ["Calf Press on Leg Press", "3 × 12–20", "strength"], ["Hanging Knee Raise", "3 × 10–15", "bodyweight"]]}, "Thursday": {"title": "Shoulders + Chest + Triceps", "focus": "Delts, chest and triceps", "ex": [["Seated Dumbbell Shoulder Press", "3 × 8–12", "strength"], ["Incline Chest Press Machine", "3 × 8–12", "strength"], ["Supported Cable Lateral Raise", "3 × 12–15 each", "strength"], ["Single-Arm Cable Rear Delt Fly", "2 × 12–15 each", "strength"], ["Overhead Rope Extension", "3 × 10–15", "strength"]]}, "Friday": {"title": "Back + Biceps + Legs + Abs", "focus": "Back, arms, lower body and core", "ex": [["Lat Pulldown", "3 × 8–12", "strength"], ["Seated Row Machine", "2 × 8–12", "strength"], ["Leg Press", "3 × 10–12", "strength"], ["Smith Hip Thrust", "3 × 8–12", "strength"], ["Incline Rotational Dumbbell Curl", "3 × 10–12", "strength"], ["Standing Cable Rotation", "2 × 12–15 each", "strength"]]}, "Saturday": {"title": "Optional Full Body", "focus": "Bonus session • 2–3 reps in reserve • skip muscles still sore or fatigued", "ex": [["Incline Chest Press Machine", "2 × 10–12", "strength"], ["Seated Cable Row", "2 × 10–12", "strength"], ["Leg Press", "2 × 12–15", "strength"], ["Seated Leg Curl", "2 × 12–15", "strength"], ["Supported Cable Lateral Raise", "2 × 12–15 each", "strength"], ["Cable Hammer Curl", "2 × 10–12", "strength"], ["Overhead Rope Extension", "2 × 10–12", "strength"], ["Cable Crunch", "3 × 12–15", "strength"]]}, "Sunday": {"title": "Recovery", "focus": "Rest and prepare for next week", "ex": [["Easy Walk", "Optional", "cardio"], ["Meal Prep", "Optional", "bodyweight"]]}};
const STORE=(()=>{let mem={};try{const t='__test';localStorage.setItem(t,'1');localStorage.removeItem(t);return{get:k=>localStorage.getItem(k),set:(k,v)=>localStorage.setItem(k,v),del:k=>localStorage.removeItem(k)}}catch(e){return{get:k=>Object.prototype.hasOwnProperty.call(mem,k)?mem[k]:null,set:(k,v)=>{mem[k]=String(v)},del:k=>{delete mem[k]}}}})();
const days=Object.keys(PLAN);let active=days.includes(STORE.get('bwd_active'))?STORE.get('bwd_active'):today();let timerHandle=null,timerSeconds=90;
function today(){return ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][new Date().getDay()]}
function key(type,day,i){return `bwd_v5_${type}_${day==='Saturday'?'SaturdayFullBody':day}_${i}`}
if(!STORE.get('bwd_v5_migrated')){for(const [day,data] of Object.entries(PLAN)){data.ex.forEach((e,i)=>{for(const type of ['weight','previous','pr']){const matches=[];for(const [od,op] of Object.entries(OLD_PLAN)){op.ex.forEach((oe,oi)=>{if(oe[0]===e[0]&&oe[2]===e[2]){const v=STORE.get(`bwd_${type}_${od}_${oi}`);if(v)matches.push({v,od})}})}const m=matches.find(x=>x.od===day)||(matches.length===1?matches[0]:null);if(m)STORE.set(key(type,day,i),m.v)}})}STORE.set('bwd_v5_migrated','1')}
function esc(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function num(v){const n=parseFloat(v);return Number.isFinite(n)?n:0}
function renderTabs(){const t=document.getElementById('tabs');t.innerHTML='';days.forEach(d=>{const b=document.createElement('button');b.className='tab'+(d===active?' active':'');b.textContent=d.slice(0,3);b.addEventListener('click',()=>{active=d;STORE.set('bwd_active',d);render()});t.appendChild(b)})}
function recommendation(day,i,current,prev,pr,type){if(type!=='strength'||!prev)return'';const p=num(prev),c=num(current),best=num(pr);if(c>best&&c>0)return'<span class="pr">NEW PR</span>';if(p>0)return`Aim to beat ${esc(prev)} with clean form.`;return''}
function completedCount(){return PLAN[active].ex.reduce((n,_,i)=>n+(STORE.get(key('done',active,i))==='1'?1:0),0)}
function renderMain(){const data=PLAN[active],done=completedCount(),pct=Math.round(done/data.ex.length*100);let h=`<section class="hero"><small>${active}</small><h2>${esc(data.title)}</h2><p>${esc(data.focus)}</p><div class="progress"><div style="width:${pct}%"></div></div></section>`;h+=`<section class="rule"><strong>Progress rule:</strong> when every set reaches the top of the rep range with clean form, increase the weight one machine increment next time. Leave ${active==='Saturday'?'2–3':'1–2'} reps in reserve; rest 2 minutes on compound lifts and 60–90 seconds on isolation lifts.</section>`;
data.ex.forEach((e,i)=>{const [name,scheme,type]=e,current=STORE.get(key('weight',active,i))||'',prev=STORE.get(key('previous',active,i))||'',pr=STORE.get(key('pr',active,i))||'',checked=STORE.get(key('done',active,i))==='1';const label=type==='cardio'?'Setting':type==='bodyweight'?'Result':'Weight';const placeholder=type==='cardio'?'speed / incline':type==='bodyweight'?'reps / time':'lbs';h+=`<article class="exercise ${checked?'done':''}" data-row="${i}"><input class="check" type="checkbox" data-check="${i}" ${checked?'checked':''}><div><div class="name">${esc(name)}${current&&num(current)>num(pr)?'<span class="pr">PR</span>':''}</div><div class="scheme">${esc(scheme)}</div><div class="previous">Previous: <strong>${esc(prev||'—')}</strong></div><div class="suggest">${recommendation(active,i,current,prev,pr,type)}</div></div><label class="weight"><span>${label}</span><input data-weight="${i}" inputmode="decimal" placeholder="${placeholder}" value="${esc(current)}"></label></article>`});
h+=`<section class="timer"><div><small>REST TIMER</small><div id="timer">${formatTime(timerSeconds)}</div></div><div class="timer-actions"><button class="ghost" id="timer60">60s</button><button id="timer90">90s</button><button id="timer120">120s</button></div></section>`;
h+=`<section class="panel"><h3>Weekly Progress</h3><div class="stats"><div class="stat"><strong id="weekCount">${weekCount()}</strong><span>workouts this week (goal: 5)</span></div><div class="stat"><strong>${pct}%</strong><span>today complete</span></div><div class="stat"><strong>${totalPRs()}</strong><span>tracked PRs</span></div></div></section>`;
h+=`<section class="panel"><h3>Body Measurements</h3><div class="measure-grid"><label>Weight (lb)<input id="mWeight" inputmode="decimal" value="${esc(STORE.get('bwd_measure_weight')||'')}"></label><label>Waist (in)<input id="mWaist" inputmode="decimal" value="${esc(STORE.get('bwd_measure_waist')||'')}"></label><label>Chest (in)<input id="mChest" inputmode="decimal" value="${esc(STORE.get('bwd_measure_chest')||'')}"></label><label>Arms (in)<input id="mArms" inputmode="decimal" value="${esc(STORE.get('bwd_measure_arms')||'')}"></label></div><div class="panel-actions"><button id="saveMeasures">Save Measurements</button></div></section>`;
h+=`<section class="panel"><h3>Recent Workouts</h3><div class="history">${historyHTML()}</div></section>`;document.getElementById('content').innerHTML=h;bindMain()}
function bindMain(){document.querySelectorAll('[data-check]').forEach(el=>el.addEventListener('change',()=>{STORE.set(key('done',active,el.dataset.check),el.checked?'1':'0');renderMain()}));document.querySelectorAll('[data-weight]').forEach(el=>el.addEventListener('input',()=>STORE.set(key('weight',active,el.dataset.weight),el.value)));document.getElementById('timer60').onclick=()=>startTimer(60);document.getElementById('timer90').onclick=()=>startTimer(90);document.getElementById('timer120').onclick=()=>startTimer(120);document.getElementById('saveMeasures').onclick=saveMeasures}
function render(){renderTabs();renderMain();updateStreak()}
function formatTime(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function startTimer(seconds){clearInterval(timerHandle);timerSeconds=seconds;updateTimer();timerHandle=setInterval(()=>{timerSeconds--;updateTimer();if(timerSeconds<=0){clearInterval(timerHandle);timerHandle=null;if(navigator.vibrate)navigator.vibrate([200,100,200])}},1000)}
function updateTimer(){const e=document.getElementById('timer');if(e)e.textContent=formatTime(Math.max(0,timerSeconds))}
function finishWorkout(){if(active==='Sunday'){alert('Recovery day — no workout required.');return}const date=new Date().toISOString().slice(0,10);PLAN[active].ex.forEach((e,i)=>{const v=STORE.get(key('weight',active,i))||'';if(v){STORE.set(key('previous',active,i),v);if(e[2]==='strength'&&num(v)>num(STORE.get(key('pr',active,i))||0))STORE.set(key('pr',active,i),v)}STORE.set(key('done',active,i),'0')});let hist=[];try{hist=JSON.parse(STORE.get('bwd_history')||'[]')}catch(e){}hist=hist.filter(x=>!(x.date===date&&x.day===active));hist.unshift({date,day:active,title:PLAN[active].title});STORE.set('bwd_history',JSON.stringify(hist.slice(0,40)));render();alert('Workout saved. Your current weights are now your previous weights.')}
function clearChecks(){PLAN[active].ex.forEach((_,i)=>STORE.set(key('done',active,i),'0'));renderMain()}
function getHistory(){try{return JSON.parse(STORE.get('bwd_history')||'[]')}catch(e){return[]}}
function historyHTML(){const h=getHistory().slice(0,6);return h.length?h.map(x=>`${esc(x.date)} — <strong>${esc(x.day)}</strong>: ${esc(x.title)}`).join('<br>'):'No completed workouts yet.'}
function weekCount(){const now=new Date(),start=new Date(now);start.setDate(now.getDate()-((now.getDay()+6)%7));start.setHours(0,0,0,0);return getHistory().filter(x=>x.day!=='Sunday'&&new Date(x.date+'T12:00:00')>=start).length}
function totalPRs(){let n=0;days.forEach(d=>PLAN[d].ex.forEach((_,i)=>{if(STORE.get(key('pr',d,i)))n++}));return n}
function updateStreak(){const unique=[...new Set(getHistory().map(x=>x.date))].sort().reverse();let streak=0,d=new Date();for(let i=0;i<400;i++){const s=d.toISOString().slice(0,10);if(unique.includes(s)){streak++;d.setDate(d.getDate()-1)}else if(i===0){d.setDate(d.getDate()-1)}else break}document.getElementById('streak').textContent=`${streak} day streak`}
function saveMeasures(){['Weight','Waist','Chest','Arms'].forEach(n=>STORE.set('bwd_measure_'+n.toLowerCase(),document.getElementById('m'+n).value));STORE.set('bwd_measure_date',new Date().toISOString());alert('Measurements saved on this device.')}
function showError(err){document.getElementById('content').innerHTML=`<section class="error"><strong>The app hit an error.</strong><br>${esc(err&&err.message?err.message:String(err))}</section>`}
window.addEventListener('error',e=>showError(e.error||e.message));document.getElementById('finishBtn').addEventListener('click',finishWorkout);document.getElementById('clearBtn').addEventListener('click',clearChecks);
try{render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.getRegistrations().then(rs=>rs.filter(r=>r.scope===new URL('./',location.href).href).forEach(r=>r.update().catch(()=>{}))).catch(()=>{})}catch(e){showError(e)}
</script>
</body>
</html>
